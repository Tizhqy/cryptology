[project]
name = "cryptology-security-lab"
version = "0.1.0"
description = "Educational secure communication and cryptology laboratory"
requires-python = ">=3.11"
dependencies = [
    "cryptography",
    "pytest",
    "pytest-asyncio",
    "pyside6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
